name: aurora-resort

services:
  postgres:
    image: postgres:16-alpine
    container_name: aurora_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aurora_resort}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aurora_resort}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aurora-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aurora_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/aurora_resort}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      API_SECURITY_TOKEN_SECRET: ${JWT_SECRET:-super-secret-jwt-key-aurora-resort-2026}
      API_SECURITY_TOKEN_ISSUER: ${JWT_ISSUER:-aurora-resort}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    networks:
      - aurora-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aurora_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    networks:
      - aurora-network

volumes:
  postgres_data:
    driver: local

networks:
  aurora-network:
    driver: bridge
